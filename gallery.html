<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Murshad Aziz Butt: Gallery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #4f46e5;
    --accent-light: #eef0fe;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e9e9ee;
  }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    color: var(--text);
    line-height: 1.6;
  }
  nav {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 22px 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  nav a {
    text-decoration: none;
    color: var(--text);
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding-bottom: 4px;
  }
  nav a.active { border-bottom: 2px solid var(--accent); color: var(--accent); }
  nav a:hover { color: var(--accent); }
  .container {
    max-width: 940px;
    margin: 0 auto;
    padding: 70px 24px;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 8px;
    text-align: center;
  }
  .lead {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 48px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }
  figure {
    margin: 0;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 24px rgba(0,0,0,0.06);
  }
  figure img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }
  figure:hover img { transform: scale(1.08); }
  figcaption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 12px 14px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(0deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 100%);
  }
  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: #999;
    border-top: 1px solid var(--border);
    margin-top: 60px;
  }
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="hobbies.html">Hobbies</a>
  <a href="skills.html">Skills</a>
  <a href="gallery.html" class="active">Gallery</a>
  <a href="contact.html">Contact Me</a>
</nav>

<div class="container">
  <h1>Image Gallery</h1>
  <div class="lead">A few visuals from my interests</div>

  <div class="grid">
    <figure>
      <img src="https://cdn.pixabay.com/photo/2021/11/14/19/18/soccer-6795556_640.jpg" alt="Football">
      <figcaption>Football</figcaption>
    </figure>
    <figure>
      <img src="https://cdn.pixabay.com/photo/2018/11/07/23/51/chess-3801531_1280.jpg" alt="Chess">
      <figcaption>Chess</figcaption>
    </figure>
    <figure>
      <img src="https://cdn.pixabay.com/photo/2017/04/09/12/00/gaming-2215601_640.jpg" alt="Gaming">
      <figcaption>Gaming</figcaption>
    </figure>
    <figure>
      <img src="https://cdn.pixabay.com/photo/2016/11/30/20/58/programming-1873854_1280.png" alt="Programming">
      <figcaption>Programming</figcaption>
    </figure>
    <figure>
      <img src="https://cdn.pixabay.com/photo/2019/08/06/22/48/artificial-intelligence-4389372_1280.jpg" alt="Machine Learning">
      <figcaption>Machine Learning</figcaption>
    </figure>
  </div>
</div>

<footer>&copy; 2026 Murshad Aziz Butt</footer>

</body>
</html>
