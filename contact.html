<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #4f46e5;
    --accent-light: #eef0fe;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e9e9ee;
  }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    color: var(--text);
    line-height: 1.6;
  }
  nav {
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 22px 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  nav a {
    text-decoration: none;
    color: var(--text);
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding-bottom: 4px;
  }
  nav a.active { border-bottom: 2px solid var(--accent); color: var(--accent); }
  nav a:hover { color: var(--accent); }
  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 100px 24px;
    text-align: center;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .lead {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 40px;
  }
  .card {
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    text-align: left;
    box-shadow: 0 10px 24px rgba(0,0,0,0.04);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row .icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    background: var(--accent-light);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #999;
    margin-bottom: 2px;
  }
  .value, .value a {
    font-size: 15px;
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
  }
  .value a:hover { color: var(--accent); }
  footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: #999;
    border-top: 1px solid var(--border);
  }
</style>
